# List view keybinds
[list]
move_up = ["Up", "k"]
move_down = ["Down", "j"]
open = ["Enter"]
delete = ["d", "Delete"]
quit = ["q"]
help = ["?", "F1"]
open_location = ["f"]
cycle_focus = ["Tab"]
confirm = ["y", "Enter"]
cancel = ["n", "Esc"]
toggle_button = ["Enter", "Space"]
new_from_template = ["t"]
create_folder = ["n"]
create_note = ["a"]
rename_folder = ["r"]
move_note = ["m"]
manage_tags = ["."]
filter_tags = ["/"]
collapse_folder = ["h"]
expand_folder = ["l"]
open_command_palette = ["Ctrl+p", "Shift+Enter"]
open_graph = ["Ctrl+g"]

# QoL bindings
rename = ["r"]
duplicate = ["y"]
toggle_pin = ["p"]
cycle_sort = ["s"]
search = ["Ctrl+f"]
jump_to_top = ["Shift+G"]
page_up = ["Ctrl+u"]
page_down = ["Ctrl+d"]
open_trash = ["Shift+T"]
toggle_preview = ["Shift+P"]

# Editor view keybinds
[edit]
quit = ["Ctrl+q"]
back = ["Esc"]
cycle_focus = ["Tab"]
toggle_button = ["Enter", "Space"]
select_all = ["Ctrl+a"]
copy = ["Ctrl+c", "Ctrl+Insert"]
cut = ["Ctrl+x", "Shift+Delete"]
paste = ["Ctrl+v", "Shift+Insert"]
undo = ["Ctrl+z"]
redo = ["Ctrl+y", "Ctrl+Shift+z"]
delete_word = ["Ctrl+Backspace"]
delete_next_word = ["Ctrl+Delete"]
move_to_top = ["Ctrl+Home"]
move_to_bottom = ["Ctrl+End"]
toggle_markdown_preview = ["Ctrl+p"]

# Help view keybinds
[help]
close = ["Esc", "q", "?", "F1"]
scroll_up = ["Up", "k"]
scroll_down = ["Down", "j"]

# Graph view keybinds
[graph]
quit = ["Esc"]
pan_up = ["Up", "k"]
pan_down = ["Down", "j"]
pan_left = ["Left", "h"]
pan_right = ["Right", "l"]
zoom_in = ["+", "Ctrl+j"]
zoom_out = ["-", "Ctrl+k"]
open_note = ["Enter"]
auto_fit = ["a"]
help = ["?", "F1"]
toggle_search = ["f"]
toggle_minimap = ["Shift+M"]
toggle_legend = ["Shift+L"]
toggle_grid = ["Shift+G"]
toggle_status = ["Shift+S"]
refresh = ["r"]
reload_config = ["Ctrl+r"]
